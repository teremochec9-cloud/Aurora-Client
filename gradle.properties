# Настройки Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom иногда конфликтует с configuration-cache — отключаем для надёжности
org.gradle.configuration-cache=false

# Fabric: https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.17.21

# Свойства мода
version=1.2.0
group=dev.aurora
archives_base_name=aurora-client

# Зависимости
fabric_api_version=0.141.6+1.21.11

# NanoVG (векторный UI-движок) — та же версия LWJGL, что и у Minecraft
lwjgl_nanovg_version=3.3.3

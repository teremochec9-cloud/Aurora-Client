plugins {
        id 'fabric-loom' version "${loom_version}"
}

repositories {
        // Зеркало Maven Central для стабильной загрузки зависимостей
        maven {
                name = 'AliyunMirror'
                url = 'https://maven.aliyun.com/repository/public'
        }
        mavenCentral()
        // Loom сам подключает репозитории Minecraft и Fabric.
}

loom {
        splitEnvironmentSourceSets()

        runs {
                client {
                        client()
                        // размер окна для локальных тестов/скриншотов
                        programArgs "--width", "1280", "--height", "800"
                        // ограничиваем кучу игры, чтобы песочница не уходила в OOM
                        vmArgs "-Xms256m", "-Xmx768m", "-XX:MaxMetaspaceSize=320m"
                }
        }

        mods {
                "aurora" {
                        sourceSet sourceSets.main
                        sourceSet sourceSets.client
                }
        }
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

        // Fabric API — обязательная зависимость
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

        // ===== NanoVG: векторный рендер-движок Aurora =====
        // В dev — обычная зависимость (нативы подтягиваются с classpath).
        implementation "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}"
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-linux"
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-windows"
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-windows-arm64"
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-macos"
        runtimeOnly "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-macos-arm64"
        // В готовый jar библиотека и нативы пакуются через jar-in-jar.
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}"
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-linux"
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-windows"
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-windows-arm64"
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-macos"
        include "org.lwjgl:lwjgl-nanovg:${project.lwjgl_nanovg_version}:natives-macos-arm64"
}

processResources {
        def version = project.version
        inputs.property "version", version

        filesMatching("fabric.mod.json") {
                expand "version": version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = "UTF-8"
}

java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
}

jar {
        from("LICENSE") {
                rename { "${it}_${project.base.archivesName.get()}" }
        }
}
